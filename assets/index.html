<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE — SERVER / 文件共享器</title>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <style>
        /* ============ BAUHAUS STYLE ============
           Primary triad: RED / BLUE / YELLOW + BLACK / WHITE
           Shape language: CIRCLE (blue/doc) · SQUARE (red/data)
                            · TRIANGLE (yellow/media)
           Type + Color double encoding (color-blind friendly)
           Geometric sans-serif, thick weights, generous spacing
           ====================================== */

        :root {
            --ink:   #0A0A0A;     /* primary black */
            --paper: #FAF7F0;     /* warm off-white (Bauhaus paper) */
            --red:   #E03426;     /* Bauhaus red */
            --blue:  #1F4FB0;     /* Bauhaus blue */
            --yellow:#F2C500;     /* Bauhaus yellow */
            --gray:  #8A857C;     /* warm gray */
            --hair:  #0A0A0A;     /* hairline black */
            --line:  #0A0A0A;     /* divider weight */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { font-size: 16px; }

        html, body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Avenir Next', 'Avenir', 'Century Gothic',
                         'Tw Cen MT', 'Futura', 'Quicksand',
                         'Helvetica Neue', Arial, sans-serif;
            font-weight: 500;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body { min-height: 100vh; }

        ::selection { background: var(--yellow); color: var(--ink); }

        /* Visible focus for keyboard users (readability / a11y) */
        a:focus-visible, button:focus-visible {
            outline: 4px solid var(--blue);
            outline-offset: 2px;
        }

        /* ============ SHELL ============ */
        .shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
            border-left: 0;
            border-right: 0;
        }

        /* ============ TOP BAR ============ */
        .topbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 3px solid var(--ink);
        }
        .topbar .brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        /* Bauhaus triad blocks logo */
        .logo-triad { display: flex; gap: 4px; }
        .logo-triad span {
            display: block;
            width: 14px; height: 14px;
        }
        .logo-triad .s-red    { background: var(--red); }
        .logo-triad .s-blue   {
            background: var(--blue);
            border-radius: 50%;
        }
        .logo-triad .s-yellow {
            width: 0; height: 0;
            background: transparent;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 14px solid var(--yellow);
        }
        .topbar .meta {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--gray);
        }
        .topbar .loc {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--gray);
        }
        .topbar .loc::before {
            content: '';
            display: block;
            width: 10px; height: 10px;
            background: var(--red);
            border-radius: 50%;
        }

        /* ============ HERO ============ */
        .hero {
            display: grid;
            grid-template-columns: 7fr 5fr;
            align-items: stretch;
            border-bottom: 3px solid var(--ink);
        }
        .hero-title-wrap {
            padding: 56px 0 44px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-right: 3px solid var(--ink);
        }
        .hero-kicker {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--red);
            margin-bottom: 18px;
        }
        .hero-title {
            font-size: clamp(56px, 9vw, 132px);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.035em;
            text-transform: uppercase;
        }
        .hero-title .row { display: block; }
        .hero-title .accent-b { color: var(--blue); }
        .hero-title .accent-y {
            color: var(--ink);
            background: var(--yellow);
            padding: 0 8px;
            display: inline-block;
        }
        .hero-sub {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        /* Bauhaus geometric composition on the right */
        .hero-figure {
            position: relative;
            background: var(--ink);
            overflow: hidden;
            min-height: 280px;
        }
        .hero-figure .fig-circle {
            position: absolute;
            top: 32px; right: 36px;
            width: 130px; height: 130px;
            background: var(--blue);
            border-radius: 50%;
        }
        .hero-figure .fig-square {
            position: absolute;
            bottom: 32px; left: 36px;
            width: 100px; height: 100px;
            background: var(--red);
        }
        .hero-figure .fig-tri {
            position: absolute;
            bottom: 56px; right: 80px;
            width: 0; height: 0;
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 120px solid var(--yellow);
        }
        .hero-figure .fig-bar {
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 14px;
            background: var(--yellow);
            transform: translateY(-50%);
        }
        .hero-stat {
            position: absolute;
            top: 24px; left: 24px;
            color: var(--paper);
            z-index: 2;
        }
        .hero-stat .num {
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .hero-stat .label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--yellow);
            margin-top: 6px;
        }

        /* ============ BREADCRUMB ============ */
        .crumbs {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 18px 0;
            border-bottom: 3px solid var(--ink);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }
        .crumbs a {
            color: var(--ink);
            text-decoration: none;
            padding: 6px 12px;
            border: 2px solid transparent;
            transition: background .15s ease, color .15s ease;
        }
        .crumbs a:hover {
            background: var(--blue);
            color: var(--paper);
        }
        .crumbs .sep { color: var(--gray); font-weight: 400; }
        .crumbs .current {
            background: var(--yellow);
            color: var(--ink);
        }

        /* ============ SEARCH ============ */
        .search {
            margin-left: auto;
            display: flex;
            align-items: stretch;
            border: 2px solid var(--ink);
            background: var(--paper);
            transition: background .15s ease;
        }
        .search:focus-within {
            background: var(--yellow);
        }
        .search-icon {
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            position: relative;
            flex-shrink: 0;
        }
        .search-icon::before {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid var(--yellow);
            border-radius: 50%;
        }
        .search-icon::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 2px;
            background: var(--yellow);
            top: 24px;
            left: 22px;
            transform: rotate(45deg);
            transform-origin: left center;
        }
        .search input {
            border: none;
            outline: none;
            background: transparent;
            padding: 0 14px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink);
            width: 240px;
            height: 36px;
        }
        .search input::placeholder {
            color: var(--gray);
            font-weight: 700;
        }
        @media (max-width: 768px) {
            .search { margin-left: 0; width: 100%; }
            .search input { width: 100%; flex: 1; }
        }

        /* ============ UPLOAD ============ */
        .upload {
            display: grid;
            grid-template-columns: 2fr 10fr;
            border-bottom: 3px solid var(--ink);
        }
        .upload-label {
            padding: 26px 24px 26px 0;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--ink);
            border-right: 3px solid var(--ink);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .upload-label::before {
            content: '';
            display: block;
            width: 16px; height: 16px;
            background: var(--red);
        }
        .upload-zone {
            padding: 22px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            position: relative;
            background: transparent;
            border: 3px dashed var(--ink);
            border-left: none;
            transition: background .15s ease, color .15s ease;
        }
        .upload-zone:hover,
        .upload-zone.dragover {
            background: var(--yellow);
            color: var(--ink);
        }
        .upload-hint {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            min-width: 220px;
        }
        .upload-hint .em { color: var(--red); font-weight: 900; }
        #fileInput { display: none; }
        .upload-btn {
            background: var(--ink);
            color: var(--paper);
            border: 3px solid var(--ink);
            padding: 14px 28px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }
        .upload-btn:hover {
            background: var(--red);
            border-color: var(--red);
        }
        .progress-bar {
            display: none;
            position: absolute;
            left: 0; right: 0; bottom: -3px;
            height: 6px;
            background: var(--gray);
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--red);
            transition: width .15s linear;
        }

        /* ============ SECTION HEAD ============ */
        .files { padding-bottom: 0; }
        .section-head {
            display: grid;
            grid-template-columns: 2fr 10fr;
            border-bottom: 3px solid var(--ink);
        }
        .section-title {
            padding: 22px 24px 22px 0;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--ink);
            border-right: 3px solid var(--ink);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 16px; height: 16px;
            background: var(--blue);
            border-radius: 50%;
        }
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            padding: 0 0 0 0;
            background: transparent;
        }
        .filter-tab {
            background: transparent;
            border: none;
            border-right: 2px solid rgba(10,10,10,0.15);
            padding: 22px 20px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--gray);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background .15s ease, color .15s ease;
        }
        .filter-tab:last-child { border-right: none; }
        .filter-tab .glyph {
            display: inline-block;
            width: 12px; height: 12px;
            background: var(--gray);
            transition: background .15s ease;
        }
        /* Shape encoding per filter */
        .filter-tab[data-filter="all"]      .glyph { background: var(--ink); }
        .filter-tab[data-filter="folder"]   .glyph {
            background: var(--yellow);
        }
        .filter-tab[data-filter="image"]    .glyph {
            background: transparent;
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--blue);
        }
        .filter-tab[data-filter="document"] .glyph {
            background: var(--blue);
            border-radius: 50%;
        }
        .filter-tab[data-filter="code"]     .glyph {
            background: var(--ink);
            border-radius: 50%;
        }
        .filter-tab[data-filter="media"]    .glyph {
            background: transparent;
            width: 0; height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 12px solid var(--ink);
        }
        .filter-tab[data-filter="archive"]  .glyph {
            background: transparent;
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--red);
        }

        .filter-tab:hover { color: var(--ink); background: rgba(242,197,0,0.25); }
        .filter-tab.active {
            color: var(--paper);
            background: var(--ink);
            border-right-color: var(--paper);
        }
        .filter-tab.active[data-filter="all"]      .glyph { background: var(--paper); }
        .filter-tab.active[data-filter="folder"]   .glyph {
            background: var(--yellow);
            border: none;
        }
        .filter-tab.active[data-filter="image"]    .glyph {
            border-bottom-color: var(--blue);
        }
        .filter-tab.active[data-filter="document"] .glyph { background: var(--blue); }
        .filter-tab.active[data-filter="code"]     .glyph { background: var(--paper); }
        .filter-tab.active[data-filter="media"]    .glyph {
            border-left-color: var(--paper);
        }
        .filter-tab.active[data-filter="archive"]  .glyph {
            border-bottom-color: var(--red);
        }

        /* ============ FILE GRID ============ */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            counter-reset: card;
            gap: 0;
        }
        .file-card {
            counter-increment: card;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0;
            background: var(--paper);
            border-right: 2px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            transition: background .15s ease, transform .15s ease;
            min-height: 280px;
        }
        .file-card.end-row { border-right: none; }
        .file-card::before {
            content: counter(card, decimal-leading-zero);
            position: absolute;
            top: 12px; left: 14px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--paper);
            z-index: 3;
            mix-blend-mode: difference;
        }
        .file-card:hover { background: var(--ink); }
        .file-card:hover .file-name { color: var(--paper); }
        .file-card:hover .file-meta { color: var(--yellow); }
        .file-card:hover .file-meta .sep { color: var(--paper); }
        .file-card:hover .file-actions { border-color: var(--paper); }
        .file-card:hover .file-actions a {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--paper);
        }

        /* ============ THUMB + SHAPE ============ */
        .thumb {
            width: 100%;
            aspect-ratio: 5 / 4;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            overflow: hidden;
            transition: background .15s ease;
        }
        .file-card:hover .thumb { background: var(--ink); }
        .thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .file-card:hover .thumb img {
            mix-blend-mode: multiply;
        }

        /* The Bauhaus shape — purely decorative, CSS-drawn */
        .shape {
            position: absolute;
            z-index: 1;
            transition: transform .25s ease;
        }
        .file-card:hover .shape { transform: scale(1.08); }

        /* Document → blue CIRCLE */
        .file-card[data-type="document"] .shape {
            width: 120px; height: 120px;
            background: var(--blue);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="document"]:hover .shape {
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* Image → blue TRIANGLE (pointing up) */
        .file-card[data-type="image"] .thumb { background: var(--paper); }
        .file-card[data-type="image"]:hover .thumb { background: var(--blue); }
        .file-card[data-type="image"] .shape {
            width: 0; height: 0;
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 120px solid var(--blue);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="image"]:hover .shape {
            transform: translate(-50%, -50%) scale(1.08);
        }
        /* When image has actual <img>, hide the decorative shape */
        .file-card[data-type="image"] .thumb:has(img) .shape { display: none; }

        /* Code → black CIRCLE */
        .file-card[data-type="code"] .shape {
            width: 110px; height: 110px;
            background: var(--ink);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="code"]:hover .shape {
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* Media → red TRIANGLE (pointing right = "play") */
        .file-card[data-type="media"] .thumb { background: var(--ink); }
        .file-card[data-type="media"] .shape {
            width: 0; height: 0;
            border-top: 60px solid transparent;
            border-bottom: 60px solid transparent;
            border-left: 100px solid var(--red);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="media"]:hover .shape {
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Archive → black TRIANGLE with thick red outline (nested via ::after).
           Both triangles share the same centroid; rotation pivots on it. */
        .file-card[data-type="archive"] .shape {
            width: 0; height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 104px solid var(--red);
            top: 50%; left: 50%;
            /* Origin at triangle centroid: x=50% of 120=60, y=2/3 of 104=69.33 */
            transform-origin: 50% 66.67%;
            /* Extra Y shift (-17px) drops border-box center so the centroid
               lands on the thumb center (centroid sits 17px below box center) */
            transform: translate(-50%, -50%) translateY(-17px);
        }
        .file-card[data-type="archive"] .shape::after {
            content: '';
            position: absolute;
            /* top + left align inner triangle centroid with outer's centroid */
            top: 21px;
            left: -42px;
            width: 0; height: 0;
            border-left: 42px solid transparent;
            border-right: 42px solid transparent;
            border-bottom: 72px solid var(--ink);
            /* No own transform — inherits parent's rotation/scale */
        }
        .file-card[data-type="archive"]:hover .shape {
            transform: translate(-50%, -50%) translateY(-17px) scale(1.08) rotate(8deg);
        }

        /* Folder → black SQUARE + thick yellow outline */
        .file-card[data-type="folder"] .shape {
            width: 110px; height: 110px;
            background: var(--ink);
            border: 10px solid var(--yellow);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="folder"]:hover .shape {
            transform: translate(-50%, -50%) rotate(8deg) scale(1.05);
        }

        /* Other → gray CIRCLE outline */
        .file-card[data-type="other"] .shape {
            width: 110px; height: 110px;
            border: 12px solid var(--gray);
            border-radius: 50%;
            background: transparent;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .file-card[data-type="other"]:hover .shape {
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* ============ TYPE TAG ============ */
        .type-tag {
            position: absolute;
            top: 0; right: 0;
            z-index: 3;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.14em;
            padding: 6px 12px;
            text-transform: uppercase;
            color: var(--paper);
            background: var(--ink);
        }
        .file-card[data-type="image"]   .type-tag { background: var(--ink); }
        .file-card[data-type="document"]:not(:hover) .type-tag { background: var(--blue); }
        .file-card[data-type="code"]    .type-tag { background: var(--ink); }
        .file-card[data-type="media"]   .type-tag { background: var(--red); }
        .file-card[data-type="archive"] .type-tag { background: var(--red); }
        .file-card[data-type="folder"]  .type-tag { background: var(--ink); }
        .file-card[data-type="other"]   .type-tag { background: var(--gray); }
        .file-card:hover .type-tag { background: var(--yellow); color: var(--ink); }

        /* ============ TEXT ============ */
        .file-name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--ink);
            padding: 16px 16px 6px;
            word-break: break-all;
            transition: color .15s ease;
        }
        .file-meta {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--gray);
            padding: 0 16px 14px;
            transition: color .15s ease;
        }
        .file-meta .sep { color: var(--ink); margin: 0 6px; transition: color .15s ease; }

        /* ============ ACTIONS ============ */
        .file-actions {
            display: flex;
            margin-top: auto;
            border-top: 2px solid var(--ink);
            transition: border-color .15s ease;
        }
        .file-actions a {
            flex: 1;
            text-align: center;
            padding: 13px 8px;
            background: var(--paper);
            color: var(--ink);
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border-right: 2px solid var(--ink);
            transition: background .15s ease, color .15s ease;
        }
        .file-actions a:last-child { border-right: none; }
        .file-actions a:hover { background: var(--red); color: var(--paper); }
        .file-actions a.full-btn { flex: 1; }

        .file-card.hidden { display: none; }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            grid-column: 1 / -1;
            padding: 80px 24px;
            border-bottom: 2px solid var(--ink);
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .empty-state .em-shape {
            width: 90px; height: 90px;
            border: 12px solid var(--gray);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .empty-state .em-text {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gray);
        }
        .empty-state .em-text strong {
            display: block;
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
            text-transform: none;
        }

        /* ============ FOOTER ============ */
        .foot {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 24px 0 40px;
            border-top: 3px solid var(--ink);
            margin-top: 0;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--gray);
        }
        .foot .triad {
            display: flex; gap: 4px;
        }
        .foot .triad span {
            display: block;
            width: 12px; height: 12px;
        }
        .foot .triad .r { background: var(--red); }
        .foot .triad .b {
            background: var(--blue);
            border-radius: 50%;
        }
        .foot .triad .y {
            width: 0; height: 0;
            background: transparent;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--yellow);
        }
        .foot .c { text-align: center; }
        .foot .r { text-align: right; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1024px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .shell { padding: 0 20px; }
            .hero { grid-template-columns: 1fr; }
            .hero-title-wrap {
                border-right: none;
                border-bottom: 3px solid var(--ink);
                padding: 36px 0 28px;
            }
            .hero-figure { min-height: 200px; }
            .upload { grid-template-columns: 1fr; }
            .upload-label {
                border-right: none;
                border-bottom: 3px solid var(--ink);
                padding: 16px 0;
            }
            .upload-zone { border-left: none; border-top: none; }
            .section-head { grid-template-columns: 1fr; }
            .section-title {
                border-right: none;
                border-bottom: 3px solid var(--ink);
                padding: 16px 0;
            }
            .filter-tabs { overflow-x: auto; }
            .filter-tab { padding: 16px 16px; white-space: nowrap; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            .topbar { grid-template-columns: auto 1fr; }
            .topbar .meta { display: none; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .file-card { border-right: none !important; }
            .hero-title { font-size: 56px; }
            .upload-zone { flex-direction: column; align-items: stretch; }
            .upload-btn { width: 100%; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="shell">

        <!-- TOP BAR -->
        <header class="topbar">
            <div class="brand">
                <div class="logo-triad">
                    <span class="s-red"></span>
                    <span class="s-blue"></span>
                    <span class="s-yellow"></span>
                </div>
                FILE—SERVER
            </div>
            <div class="meta">Bauhaus Edition · 1919—2026</div>
            <div class="loc">Local Network</div>
        </header>

        <!-- HERO -->
        <section class="hero">
            <div class="hero-title-wrap">
                <div class="hero-kicker">Form Follows Function</div>
                <h1 class="hero-title">
                    <span class="row">FILE</span>
                    <span class="row"><span class="accent-b">SHA</span><span class="accent-y">RER</span></span>
                </h1>
                <div class="hero-sub">Drop · Browse · Transfer</div>
            </div>
            <div class="hero-figure">
                <div class="hero-stat">
                    <div class="num" id="fileCount">—</div>
                    <div class="label">Items in view</div>
                </div>
                <div class="fig-bar"></div>
                <div class="fig-circle"></div>
                <div class="fig-square"></div>
                <div class="fig-tri"></div>
            </div>
        </section>

        <!-- BREADCRUMB -->
        <nav class="crumbs" id="breadcrumb">{{ breadcrumb|safe }}
            <div class="search">
                <span class="search-icon"></span>
                <input type="text" id="searchInput" placeholder="SEARCH FILENAME..." autocomplete="off" spellcheck="false">
            </div>
        </nav>

        <!-- UPLOAD -->
        <section class="upload">
            <div class="upload-label">01 / UPLOAD</div>
            <div class="upload-zone" id="uploadArea">
                <div class="upload-hint">DRAG FILES HERE <span class="em">—</span> OR CLICK TO BROWSE</div>
                <button class="upload-btn" type="button" onclick="document.getElementById('fileInput').click()">SELECT FILE</button>
                <input type="file" id="fileInput" name="file">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>

        <!-- FILES -->
        <section class="files">
            <div class="section-head">
                <div class="section-title">02 / INDEX</div>
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all"><span class="glyph"></span>ALL</button>
                    <button class="filter-tab" data-filter="folder"><span class="glyph"></span>DIR</button>
                    <button class="filter-tab" data-filter="code"><span class="glyph"></span>SRC</button>
                    <button class="filter-tab" data-filter="image"><span class="glyph"></span>IMG</button>
                    <button class="filter-tab" data-filter="document"><span class="glyph"></span>DOC</button>
                    <button class="filter-tab" data-filter="media"><span class="glyph"></span>MEDIA</button>
                    <button class="filter-tab" data-filter="archive"><span class="glyph"></span>ZIP</button>
                </div>
            </div>
            <div class="grid" id="fileGrid">{{ file_grid|safe }}</div>
        </section>

        <!-- FOOTER -->
        <footer class="foot">
            <div class="triad">
                <span class="r"></span>
                <span class="b"></span>
                <span class="y"></span>
            </div>
            <div class="c">— FORM · COLOR · STRUCTURE —</div>
            <div class="r">END</div>
        </footer>

    </div>

    <script>
        // ============ UPLOAD ============
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) uploadFile(files[0]);
        });
        uploadArea.addEventListener('click', (e) => {
            if (e.target.closest('.upload-btn')) return;
            fileInput.click();
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) uploadFile(e.target.files[0]);
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload', 'upload');

            progressBar.classList.add('active');
            progressFill.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressFill.style.width = percentComplete + '%';
                }
            });
            xhr.addEventListener('load', () => {
                setTimeout(() => location.reload(), 400);
            });
            xhr.open('POST', window.location.href, true);
            xhr.send(formData);
        }

        // ============ FILTER + SEARCH ============
        const filterTabs = document.getElementById('filterTabs');
        const searchInput = document.getElementById('searchInput');

        let currentFilter = 'all';
        let currentQuery = '';

        filterTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.filter-tab');
            if (!tab) return;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.getAttribute('data-filter');
            applyFilters();
        });

        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value;
            applyFilters();
        });

        // Substring match (any position), case-insensitive.
        // Combined with the active type filter.
        function applyFilters() {
            const q = currentQuery.toLowerCase().trim();
            document.querySelectorAll('.file-card').forEach(card => {
                const cardType = card.getAttribute('data-type') || 'other';
                const name = (card.querySelector('.file-name')?.textContent || '').toLowerCase();
                const typeMatch = (currentFilter === 'all' || currentFilter === cardType);
                const queryMatch = (!q || name.indexOf(q) !== -1);
                if (typeMatch && queryMatch) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
            updateCount();
            relayout();
        }

        // ============ RELAYOUT ============
        // Re-stripe right borders after filtering / searching.
        // CSS :nth-child can't skip hidden (.hidden / display:none) cards,
        // so we mark every Nth visible card with .end-row (N = current grid columns).
        function getColumnCount() {
            const grid = document.getElementById('fileGrid');
            const cols = getComputedStyle(grid).gridTemplateColumns;
            return cols.split(' ').length || 1;
        }

        function relayout() {
            const cols = getColumnCount();
            const cards = document.querySelectorAll('.file-card');
            cards.forEach(c => c.classList.remove('end-row'));
            let visIdx = 0;
            cards.forEach(c => {
                if (c.classList.contains('hidden')) return;
                visIdx++;
                if (visIdx % cols === 0) c.classList.add('end-row');
            });
        }

        // ============ COUNT ============
        function updateCount() {
            const visible = document.querySelectorAll('.file-card:not(.hidden)').length;
            const el = document.getElementById('fileCount');
            el.textContent = String(visible).padStart(2, '0');
        }
        updateCount();
        relayout();
        window.addEventListener('resize', relayout);
    </script>
</body>
</html>
